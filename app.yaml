# Databricks Apps config - WOFFL web app (React SPA + FastAPI).
#
# CUTOVER 2026-08-06: this app.yaml replaced the Streamlit config (preserved
# in app-streamlit.yaml). Deploy = pull this repo in the workspace Git folder,
# then Deploy from the app page. web/dist is committed - Databricks never runs
# npm, so rebuild + commit dist whenever web/src changes (npm run build).
#
# Rollback = copy app-streamlit.yaml over app.yaml (or git revert the cutover
# commit), pull, Deploy.
#
# uvicorn binds automatically: the Apps runtime sets UVICORN_HOST=0.0.0.0 and
# UVICORN_PORT=DATABRICKS_APP_PORT for uvicorn/FastAPI apps.

command: ["uvicorn", "server.main:app"]

env:
  # ProcessPool cap (matches Databricks Apps medium compute, 2 vCPU).
  - name: WOFFL_MAX_WORKERS
    value: "2"

  # NOTE: ALLOW_DATABRICKS_WRITES is deliberately ABSENT. The web app is
  # read-only in v1 - it has no write endpoints - and the gate stays off as
  # defense in depth. Add the var only when write flows are ported.

resources:
  - name: sql-warehouse
    sql_warehouse:
      id: 698745db7da46ba3
      permission: CAN_USE

# Databricks Apps config - WOFFL web app (React SPA + FastAPI).
#
# Deploy = pull this repo in the workspace Git folder, then Deploy from the
# app page. web/dist is committed - Databricks never runs npm, so rebuild +
# commit dist whenever web/src changes (npm run build).
#
# The Streamlit app this replaced (cutover 2026-08-06) was DELETED 2026-08-18
# along with app-streamlit.yaml, so rollback is git history, not a config
# swap. streamlit/plotly/reportlab are no longer dependencies.
#
# uvicorn binds automatically: the Apps runtime sets UVICORN_HOST=0.0.0.0 and
# UVICORN_PORT=DATABRICKS_APP_PORT for uvicorn/FastAPI apps.

command: ["uvicorn", "server.main:app"]

env:
  # ProcessPool cap (matches Databricks Apps medium compute, 2 vCPU).
  - name: WOFFL_MAX_WORKERS
    value: "2"

  # prop_hist writes (the Solver's "Save as well default" / clear-pin).
  #
  # ENABLED 2026-08-06 with the first ported write flow. Same app = same
  # service principal (App ID 2013fc45-c30e-40ac-bef0-df0a758faa3c) that has
  # held MODIFY on mpu.wells.prop_hist since 2026-07-30 (granted under
  # Scott's identity, docs/prop_hist_asks.md ask (b)) - no new grants needed.
  #
  # The server has exactly two write endpoints (POST /wells/{name}/save-ipr,
  # DELETE /wells/{name}/ipr-pin), both routed through prop_hist_client.
  # push_prop: prop_xref whitelist, as-built physical properties rejected,
  # single parameterized INSERT only. Attribution: entry_user resolves the
  # REAL engineer from X-Forwarded-Email per request (server/identity.py);
  # without the header it falls back to current_user() = the SP.
  - name: ALLOW_DATABRICKS_WRITES
    value: "true"

resources:
  - name: sql-warehouse
    sql_warehouse:
      id: 698745db7da46ba3
      permission: CAN_USE
